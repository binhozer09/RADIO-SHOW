<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>Linux Remoto</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090b12;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100svh}.app{min-height:100svh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));gap:16px}.head{text-align:center;padding:18px 8px 8px}.head h1{font-size:27px;letter-spacing:.04em;margin:0 0 6px}.head p{margin:0;color:#9da8b9;font-size:14px}.panel{width:100%;max-width:720px;margin:0 auto;background:#151b27;border:1px solid #293449;border-radius:18px;padding:18px;box-shadow:0 12px 38px #0005}.label{font-size:13px;color:#b9c5d7;margin:0 0 8px}.password{width:100%;height:50px;border:1px solid #39475d;border-radius:11px;background:#0c111b;color:#fff;padding:0 14px;font-size:16px;outline:none}.password:focus{border-color:#63a5ff}.actions{display:flex;gap:10px;margin-top:12px}.btn{min-height:48px;border:0;border-radius:11px;padding:0 16px;font-weight:750;font-size:15px;cursor:pointer}.primary{background:#2475e8;color:white;flex:1}.secondary{background:#293449;color:#e8eef8}.btn:disabled{opacity:.55}.status{display:flex;align-items:center;gap:9px;margin:14px 0 0;color:#b9c5d7;font-size:13px;min-height:20px}.dot{width:9px;height:9px;border-radius:50%;background:#e0a43c;flex:none}.dot.ok{background:#37d68a}.dot.bad{background:#ff6666}.tip{text-align:center;color:#77849a;font-size:12px;line-height:1.5;margin:auto auto 0;max-width:520px}.screen{display:none;position:fixed;inset:0;z-index:5;background:#000;padding:0}.screen.active{display:flex;flex-direction:column}.screenbar{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:4px 8px;background:#111722;color:white}.screenbar strong{font-size:14px;flex:1}.screenbar button{height:36px;padding:0 12px;border:0;border-radius:8px;background:#293449;color:white;font-weight:700}.remote{flex:1;min-height:0;width:100%;border:0;background:#000}.screenhint{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;background:#111722df;border:1px solid #ffffff22;border-radius:9px;padding:9px 12px;font-size:12px;color:#e8eef8;pointer-events:none}
</style>
</head>
<body>
<main class="app">
<header class="head"><h1>LINUX REMOTO</h1><p>Conexão direta com o desktop hospedado no Railway</p></header>
<section class="panel">
<p class="label">Senha de acesso remoto</p>
<input id="password" class="password" type="password" autocomplete="off" placeholder="Digite a senha do Railway">
<div class="actions"><button id="connect" class="btn primary">Conectar ao Linux</button></div>
<p class="status"><span id="dot" class="dot"></span><span id="status" role="status" aria-live="polite">Verificando servidor remoto…</span></p>
</section>
<p class="tip">Este aplicativo agora é dedicado somente à conexão remota com o Linux. Mantenha a internet ativa durante a sessão.</p>
</main>
<section id="screen" class="screen" aria-label="Desktop Linux remoto">
<div class="screenbar"><button id="back">Voltar</button><strong>Desktop Linux • Railway</strong><button id="fullscreen">Tela cheia</button><button id="reconnect">Reconectar</button></div>
<iframe id="remote" class="remote" title="Desktop Linux remoto" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<div id="screenhint" class="screenhint">Solicitando conexão com o desktop Linux…</div>
</section>
<script>
const API="https://radio-show-stream-production.up.railway.app";
const $=id=>document.getElementById(id);
const password=$("password"),connect=$("connect"),status=$("status"),dot=$("dot"),screen=$("screen"),frame=$("remote"),hint=$("screenhint");
let currentToken="";
function setStatus(message,state="wait"){status.textContent=message;dot.className="dot"+(state==="ok"?" ok":state==="bad"?" bad":"");}
async function checkServer(){try{const r=await fetch(API+"/api/remote-status",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const data=await r.json();if(!data.enabled)throw new Error(data.message||"Desktop remoto desativado no Railway.");setStatus("Servidor Railway disponível. Digite a senha para conectar.","ok");}catch(e){setStatus("Não foi possível acessar o servidor: "+e.message,"bad");}}
function openRemote(){if(!currentToken){setStatus("Digite a senha de acesso.","bad");return;}connect.disabled=true;setStatus("Abrindo a sessão Linux…");hint.textContent="Carregando a tela remota e conectando ao VNC…";screen.classList.add("active");frame.src=API+"/remote/?token="+encodeURIComponent(currentToken);setStatus("Solicitação enviada ao Linux remoto.");}
function closeRemote(){frame.src="about:blank";screen.classList.remove("active");currentToken="";password.value="";connect.disabled=false;setStatus("Sessão encerrada. Digite a senha para conectar novamente.");}
connect.addEventListener("click",()=>{const p=password.value.trim();if(!p){setStatus("Digite a senha do Railway.","bad");password.focus();return;}currentToken=p;openRemote();});
password.addEventListener("keydown",e=>{if(e.key==="Enter")connect.click();});
$("back").addEventListener("click",closeRemote);
$("reconnect").addEventListener("click",()=>{frame.src="about:blank";setTimeout(()=>{frame.src=API+"/remote/?token="+encodeURIComponent(currentToken);hint.textContent="Tentando reconectar ao desktop Linux…";},150);});
$("fullscreen").addEventListener("click",async()=>{try{if(!document.fullscreenElement)await screen.requestFullscreen();else await document.exitFullscreen();}catch(e){hint.textContent="Tela cheia não disponível neste aparelho.";}}); 
frame.addEventListener("load",()=>{if(screen.classList.contains("active"))hint.textContent="Página remota carregada. Aguardando conexão VNC…";});
window.addEventListener("message",e=>{if(e.data&&e.data.radioShowRemote){hint.textContent=e.data.message||"Estado da conexão remota atualizado.";if(String(e.data.message||"").includes("CONECTADO"))setStatus("Linux conectado com sucesso.","ok");if(String(e.data.message||"").includes("DESCONECTADO")||String(e.data.message||"").includes("FALHA"))setStatus(e.data.message,"bad");}});
checkServer();
</script>
</body></html>
