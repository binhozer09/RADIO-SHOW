<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Linux remoto • RADIO SHOW</title><style>html,body,#screen{margin:0;width:100%;height:100%;background:#000;overflow:hidden}canvas{width:100%!important;height:100%!important;object-fit:contain}</style></head><body><div id="screen"></div><div id="remoteStatus" style="position:fixed;left:8px;right:8px;bottom:8px;padding:8px;background:#241735dd;color:#fff;font:12px system-ui;border-radius:8px;z-index:9999">Iniciando conexão VNC…</div><script type="module">import RFB from './core/rfb.js';const token=new URLSearchParams(location.search).get('token')||'';const status=document.getElementById('remoteStatus');function report(message){status.textContent=message;try{parent.postMessage({radioShowRemote:true,message},'*');}catch{}}report('Página remota carregada; iniciando VNC. token presente='+!!token);const scheme=location.protocol==='https:'?'wss':'ws';const rfb=new RFB(document.getElementById('screen'),scheme+'://'+location.host+'/websockify?token='+encodeURIComponent(token));rfb.scaleViewport=true;rfb.resizeSession=true;rfb.showDotCursor=true;rfb.addEventListener('connect',()=>{console.log('Linux conectado');report('VNC CONECTADO: sessão Linux estabelecida.');});rfb.addEventListener('disconnect',e=>report('VNC DESCONECTADO: '+(e.detail?.clean?'encerramento normal':'conexão perdida/recusada')));rfb.addEventListener('credentialsrequired',()=>report('VNC solicitou senha; enviando credencial.'));rfb.addEventListener('credentialsrequired',()=>rfb.sendCredentials({password:token.slice(0,8)}));rfb.addEventListener('securityfailure',()=>{report('FALHA DE AUTENTICAÇÃO VNC: senha rejeitada.');document.body.innerHTML='<p style="color:white;padding:20px">Falha na autenticação da tela Linux. Confira a senha do Railway.</p>';});window.addEventListener('error',e=>report('ERRO JAVASCRIPT REMOTO: '+e.message));window.addEventListener('unhandledrejection',e=>report('PROMISE REMOTA: '+String(e.reason)));</script></body></html>
