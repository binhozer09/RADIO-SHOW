<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#09090f"><title>Linux remoto</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090f;color:#f4f4f5;font-family:system-ui,sans-serif}#top{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#171722;border-bottom:1px solid #303040;position:relative;z-index:5}.brand{font-size:12px;font-weight:800;letter-spacing:.05em}.state{font-size:11px;color:#a7f3d0}.actions{display:flex;gap:6px}.actions button{border:1px solid #414155;border-radius:8px;background:#252538;color:#fff;padding:7px 8px;font-size:11px}#screen{position:absolute;top:48px;bottom:0;left:0;right:0;background:#000;overflow:hidden}canvas{width:100%!important;height:100%!important;object-fit:contain;touch-action:manipulation}#hint{position:absolute;bottom:8px;left:8px;right:8px;text-align:center;color:#a1a1aa;background:#171722dd;border:1px solid #39394b;border-radius:9px;padding:7px;font-size:11px;pointer-events:none}</style></head>
<body><header id="top"><div class="brand">LINUX REMOTO <span style="color:#a78bfa">• RAILWAY</span></div><div class="actions"><button id="keyboard">⌨ Teclado</button><button id="reconnect">Reconectar</button><button id="exit">Sair</button></div><span class="state" id="state">Conectando…</span></header><div id="screen"></div><div id="hint">Toque em Teclado para digitar no Bash</div>
<script type="module">
import RFB from './core/rfb.js';
const screen=document.getElementById('screen'),state=document.getElementById('state'),token=sessionStorage.getItem('linuxSessionToken')||'',vncPassword=sessionStorage.getItem('linuxVncPassword')||'';
if(!token){location.replace('/');}
let rfb;
function connect(){state.textContent='Conectando…';const scheme=location.protocol==='https:'?'wss':'ws';rfb=new RFB(screen,scheme+'://'+location.host+'/websockify?token='+encodeURIComponent(token));rfb.scaleViewport=true;rfb.resizeSession=false;rfb.showDotCursor=true;rfb.viewOnly=false;
rfb.addEventListener('connect',()=>{state.textContent='Linux conectado';document.getElementById('hint').textContent='Bash ativo na nuvem • sessão remota';});
rfb.addEventListener('disconnect',e=>{state.textContent='Desconectado';document.getElementById('hint').textContent=e.detail?.clean?'Sessão encerrada':'Conexão perdida. Toque em Reconectar.';});
rfb.addEventListener('credentialsrequired',()=>rfb.sendCredentials({password:vncPassword}));
rfb.addEventListener('securityfailure',()=>state.textContent='Falha de autenticação');
}
document.getElementById('keyboard').onclick=()=>{rfb?.focus();document.getElementById('hint').textContent='Use o teclado do Android para digitar no terminal';};
document.getElementById('reconnect').onclick=()=>{try{rfb?.disconnect();}catch{}connect();};
document.getElementById('exit').onclick=()=>{sessionStorage.removeItem('linuxSessionToken');sessionStorage.removeItem('linuxVncPassword');location.replace('/');};
screen.addEventListener('click',()=>rfb?.focus());connect();
</script></body></html>
