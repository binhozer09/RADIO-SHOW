<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Linux remoto • RADIO SHOW</title><style>html,body,#screen{margin:0;width:100%;height:100%;background:#000;overflow:hidden}canvas{width:100%!important;height:100%!important;object-fit:contain}</style></head><body><div id="screen"></div><script type="module">import RFB from './core/rfb.js';const token=new URLSearchParams(location.search).get('token')||'';const scheme=location.protocol==='https:'?'wss':'ws';const rfb=new RFB(document.getElementById('screen'),scheme+'://'+location.host+'/websockify?token='+encodeURIComponent(token));rfb.scaleViewport=true;rfb.resizeSession=true;rfb.showDotCursor=true;rfb.addEventListener('connect',()=>console.log('Linux conectado'));rfb.addEventListener('credentialsrequired',()=>rfb.sendCredentials({password:token}));rfb.addEventListener('securityfailure',()=>{document.body.innerHTML='<p style="color:white;padding:20px">Falha na autenticação da tela Linux. Confira a senha do Railway.</p>';});</script></body></html>
