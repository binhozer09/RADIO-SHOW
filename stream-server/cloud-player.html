<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RADIO SHOW Cloud Player</title></head><body style="margin:0;background:#090909;color:#fff;font:16px Arial"><main style="padding:20px"><h1>RADIO SHOW • Robinho Show</h1><p id="status">Iniciando player oficial do YouTube…</p><div id="player"></div></main><script>
const API=location.origin;let ids=[],index=0,player=null,heartbeat=null;
async function post(path,data){try{await fetch(API+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(data)});}catch(e){}}
function status(s){document.getElementById("status").textContent=s;post("/api/cloud-event",{status:s,index});}
async function start(){const [pl,sy]=await Promise.all([fetch("/api/playlist").then(r=>r.json()),fetch("/api/sync").then(r=>r.json())]);ids=pl.playlist.map(x=>x.videoId);index=sy.index||0;const tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);window.onYouTubeIframeAPIReady=()=>{player=new YT.Player("player",{height:"390",width:"640",videoId:ids[index],playerVars:{autoplay:1,controls:1,playsinline:1,rel:0,enablejsapi:1,origin:location.origin,start:sy.currentTime||0},events:{onReady:e=>{status("Player oficial pronto; iniciando reprodução");e.target.playVideo();heartbeat=setInterval(report,5000);},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING){status("Tocando faixa "+(index+1)+" de "+ids.length);report();}else if(e.data===YT.PlayerState.ENDED){index=(index+1)%ids.length;player.loadVideoById(ids[index]);}else if(e.data===YT.PlayerState.BUFFERING){status("Carregando faixa "+(index+1));}else if(e.data===YT.PlayerState.PAUSED){status("Player pausado pelo YouTube");}},onError:e=>{status("YouTube retornou erro "+e.data+"; avançando faixa");setTimeout(()=>{index=(index+1)%ids.length;player.loadVideoById(ids[index]);},2500);}}});};}
function report(){if(!player||!player.getCurrentTime)return;const t=player.getCurrentTime(),d=player.getDuration();if(Number.isFinite(t)&&Number.isFinite(d)&&d>0)post("/api/sync",{index,currentTime:t,durations:[d,d,d,d,d]});}
start().catch(e=>status("Falha ao iniciar player: "+e.message));
</script></body></html>
