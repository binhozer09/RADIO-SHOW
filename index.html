<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090f"><title>Linux Remoto • RADIO SHOW</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0,#28213d,#101018 58%,#09090f);color:#f4f4f5;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:22px}main{width:min(100%,430px);background:#171722;border:1px solid #343447;border-radius:22px;padding:26px;box-shadow:0 22px 70px #0008}.logo{font-size:25px;font-weight:900;letter-spacing:.08em;margin:0}.sub{color:#a1a1aa;font-size:13px;margin:7px 0 25px}.status{display:flex;align-items:center;gap:9px;color:#a7f3d0;font-size:12px;margin-bottom:20px}.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399}label{display:block;font-size:13px;color:#d4d4d8;margin-bottom:8px}input{width:100%;border:1px solid #414155;border-radius:11px;background:#0d0d15;color:white;padding:15px;font-size:16px;outline:none}input:focus{border-color:#a78bfa}button{width:100%;border:0;border-radius:11px;background:#7c3aed;color:white;font-size:15px;font-weight:800;padding:15px;margin-top:14px}button:disabled{opacity:.55}#message{min-height:22px;color:#fca5a5;font-size:12px;margin-top:13px}.foot{color:#71717a;font-size:11px;line-height:1.5;margin:20px 0 0}</style></head>
<body><main><h1 class="logo">LINUX REMOTO</h1><p class="sub">Acesse o terminal Linux hospedado na Railway</p><div class="status"><span class="dot"></span><span id="status">Verificando servidor…</span></div><form id="login"><label for="password">Senha de acesso</label><input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required><button id="submit" type="submit">Conectar ao Linux</button><div id="message" role="alert"></div></form><p class="foot">Sessão Linux na nuvem • Terminal Bash • HTTPS/WSS. A senha não fica salva no aplicativo.</p></main>
<script>
const form=document.getElementById('login'),password=document.getElementById('password'),button=document.getElementById('submit'),message=document.getElementById('message'),status=document.getElementById('status');
fetch('/api/remote-status',{cache:'no-store'}).then(r=>r.json()).then(s=>{status.textContent=s.enabled?'Servidor Linux online':'Acesso aguardando configuração';if(!s.enabled)message.textContent=s.message;}).catch(()=>status.textContent='Servidor indisponível');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Conectando…';message.textContent='';try{const r=await fetch('/api/remote-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha de autenticação');sessionStorage.setItem('linuxSessionToken',d.token);sessionStorage.setItem('linuxVncPassword',d.vncPassword);location.href='/remote/';}catch(e){message.textContent=e.message;button.disabled=false;button.textContent='Conectar ao Linux';}});
</script></body></html>
